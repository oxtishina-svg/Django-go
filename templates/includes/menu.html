<nav class="nav flex-column">
    <a
        class="nav-link text-white"
        href="{% url 'catalog:home' %}"
    >
        Главная
    </a>

    <a
        class="nav-link text-white"
        href="{% url 'catalog:contacts' %}"
    >
        Контакты
    </a>

    <a
        class="nav-link text-white"
        href="{% url 'blog:blog_list' %}"
    >
        Блог
    </a>

    {% if user.is_authenticated %}

        <form
            method="post"
            action="{% url 'users:logout' %}"
        >
            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-link nav-link text-white"
            >
                Выход
            </button>
        </form>

    {% else %}

        <a
            class="nav-link text-white"
            href="{% url 'users:login' %}"
        >
            Вход
        </a>

        <a
            class="nav-link text-white"
            href="{% url 'users:register' %}"
        >
            Регистрация
        </a>

    {% endif %}
</nav>
