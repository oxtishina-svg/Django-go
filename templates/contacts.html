{% extends "base.html" %}

{% block title %}
Контакты
{% endblock %}

{% block content %}

<h1 class="text-center mb-5">
    Контакты
</h1>

<div class="row g-5">

    <div class="col-md-6">
        <div class="card">
            <div class="card-body">

                <form>
                    <div class="mb-3">
                        <label
                            for="name"
                            class="form-label"
                        >
                            Имя
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="email"
                            class="form-label"
                        >
                            Почта
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="message"
                            class="form-label"
                        >
                            Сообщение
                        </label>

                        <textarea
                            class="form-control"
                            id="message"
                            rows="5"
                        ></textarea>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Отправить
                    </button>
                </form>

            </div>
        </div>
    </div>

    <div class="col-md-6">
        <h3>
            Наши контакты
        </h3>

        <p>
            Свяжитесь с нами через форму обратной связи.
        </p>

        <p>
            Email: example@example.com
        </p>

        <p>
            Телефон: +7 900 000-00-00
        </p>
    </div>

</div>

{% endblock %}
