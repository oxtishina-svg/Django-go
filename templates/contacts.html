<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>
<div class="container-fluid">
    <div class="row min-vh-100">
        <aside class="col-md-2 bg-dark text-white p-3">
            <h4 class="mb-4">Меню</h4>

            <nav class="nav flex-column">
                <a class="nav-link text-white"
                   href="{% url 'catalog:home' %}">
                    Главная
                </a>

                <a class="nav-link text-white active bg-primary rounded"
                   href="{% url 'catalog:contacts' %}">
                    Контакты
                </a>
            </nav>

            <footer class="mt-5 pt-5 small text-secondary">
                <p>Профиль</p>
                <p>Выход</p>
            </footer>
        </aside>

        <main class="col-md-10 p-5">
            <h1 class="text-center mb-5">Контакты</h1>

            <div class="row g-5">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <form>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Имя</label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="name"
                                    >
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Почта</label>
                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                    >
                                </div>

                                <div class="mb-3">
                                    <label for="message" class="form-label">
                                        Сообщение
                                    </label>
                                    <textarea
                                        class="form-control"
                                        id="message"
                                        rows="5"
                                    ></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    Отправить
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <h3>Наши контакты</h3>
                    <p>
                        Свяжитесь с нами через форму обратной связи.
                    </p>
                    <p>Email: example@example.com</p>
                    <p>Телефон: +7 900 000-00-00</p>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
