{% extends "base.html" %}

{% block title %}
Удаление товара
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card">
            <div class="card-body">

                <h1 class="mb-4">
                    Удаление товара
                </h1>

                <p>
                    Вы уверены, что хотите удалить товар
                    <strong>{{ object.name }}</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            Удалить
                        </button>

                        <a
                            href="{% url 'catalog:product_detail' object.pk %}"
                            class="btn btn-outline-secondary"
                        >
                            Отмена
                        </a>

                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
