{% extends "base.html" %}

{% block title %}
Форма статьи
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <h1 class="mb-4">
            Форма статьи
        </h1>

        <form
            method="post"
            enctype="multipart/form-data"
        >
            {% csrf_token %}

            {{ form.as_p }}

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Сохранить
                </button>

                <a
                    href="{% url 'blog:blog_list' %}"
                    class="btn btn-outline-secondary"
                >
                    Отмена
                </a>

            </div>
        </form>

    </div>
</div>

{% endblock %}
