{% extends "base.html" %}

{% block title %}
{{ post.title }}
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card">

            {% if post.preview %}
                <img
                    src="{{ post.preview.url }}"
                    class="card-img-top"
                    alt="{{ post.title }}"
                >
            {% endif %}

            <div class="card-body">

                <h1 class="card-title">
                    {{ post.title }}
                </h1>

                <p class="text-muted">
                    Создано: {{ post.created_at }}
                </p>

                <p class="text-muted">
                    Просмотров: {{ post.views_count }}
                </p>

                <div class="mb-4">
                    {{ post.content }}
                </div>

                <div class="d-flex gap-2 flex-wrap">

                    <a
                        href="{% url 'blog:blog_update' post.pk %}"
                        class="btn btn-outline-secondary"
                    >
                        Редактировать
                    </a>

                    <a
                        href="{% url 'blog:blog_delete' post.pk %}"
                        class="btn btn-outline-danger"
                    >
                        Удалить
                    </a>

                    <a
                        href="{% url 'blog:blog_list' %}"
                        class="btn btn-outline-primary"
                    >
                        Назад к блогу
                    </a>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
